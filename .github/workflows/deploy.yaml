name: Deploy Eleventy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Replace with "master" if needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Eleventy
        run: npm run build-ghpages # Calls your prefixed build script

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site" # Make sure this matches your 11ty output directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

